# Render blueprint for the HoopIQ FastAPI backend.
# In Render: New + → Blueprint → connect this repo. Render reads this file.
# After it deploys, set the two secret env vars (ANTHROPIC_API_KEY, CORS_ORIGINS)
# in the dashboard — they're marked sync:false so they are NOT stored in git.
services:
  - type: web
    name: hoopiq-api
    runtime: python
    rootDir: services/api
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PREFER_CACHE
        value: "true"   # cloud serves pre-computed snapshots (NBA blocks cloud IPs)
      - key: ANTHROPIC_API_KEY
        sync: false   # set in dashboard — your real Claude key
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: ADMIN_TOKEN
        sync: false   # leave UNSET in production -- it keeps the two model-training
                      # endpoints closed. The cloud serves pre-trained snapshots.

  # The Arena's realtime multiplayer server. Without this deployed, the web
  # app falls back to http://localhost:4000 (see socketClient.js) and every
  # visitor's browser tries to reach a server on their own machine, so no
  # room ever gets created.
  #
  # NOTE: rooms live in memory (rooms/roomStore.js). A free instance sleeps
  # after 15 minutes idle and cold-starts in ~50s, and any sleep, deploy or
  # restart destroys every in-progress game. Fine for testing; move to a paid
  # instance before anyone relies on it.
  - type: web
    name: hoopiq-arena
    runtime: node
    rootDir: services/arena-realtime
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        sync: false   # set to your Vercel URL, same value as the API's CORS_ORIGINS
      - key: HOOPIQ_API_URL
        sync: false   # REQUIRED: the hoopiq-api URL, e.g. https://hoopiq-api.onrender.com
                      # The arena fetches team rosters from the API, not from the NBA
                      # directly (see data/teamPlayersCache.js). Unset, it falls back to
                      # http://localhost:8001 and every team preload fails instantly.
